<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>トウキョウノート</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            terracotta: '#E07A5F',
            sage: '#81B29A',
            bluegrey: '#3D405B',
            cream: '#F4F1DE',
            mustard: '#F2CC8F',
          },
          fontFamily: {
            rounded: ['"M PLUS Rounded 1c"', 'sans-serif'],
          }
        }
      }
    }
  </script>
  
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <script>
    Babel.registerPreset('react-classic', {
      presets: [
        [Babel.availablePresets['react'], { "runtime": "classic" }]
      ]
    });
  </script>
  <script src="https://d3js.org/d3.v7.min.js"></script>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="icon" href="../favicon.png">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;700&display=swap" rel="stylesheet">
  
  <style>
    body {
      margin: 0;
      overflow: hidden;
      touch-action: manipulation;
      user-select: none;
      height: 100dvh; 
      width: 100vw;
      font-family: 'M PLUS Rounded 1c', sans-serif;
    }
    
    #root {
      height: 100%;
      width: 100%;
    }

    /* コルクボード風背景 */
    .bg-cork {
      background-color: #d0a57b;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.15'/%3E%3C/svg%3E");
    }

    /* 紙の質感背景 */
    .bg-paper {
      background-color: #F4F1DE;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.05'/%3E%3C/svg%3E");
    }

    /* マスキングテープ装飾 */
    .masking-tape {
      position: absolute;
      top: -12px;
      left: 50%;
      transform: translateX(-50%) rotate(-2deg);
      width: 100px;
      height: 30px;
      background-color: rgba(129, 178, 154, 0.6);
      box-shadow: 0 1px 2px rgba(0,0,0,0.1);
      z-index: 10;
      border-left: 2px dotted rgba(255,255,255,0.6);
      border-right: 2px dotted rgba(255,255,255,0.6);
    }
    .masking-tape-terracotta { background-color: rgba(224, 122, 95, 0.6); transform: translateX(-50%) rotate(3deg); }
    .masking-tape-mustard { background-color: rgba(242, 204, 143, 0.6); transform: translateX(-50%) rotate(-1deg); }

    /* 画鋲（ピン）装飾 */
    .pin {
      position: absolute;
      top: 12px;
      left: 50%;
      transform: translateX(-50%);
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, #fca5a5, #E07A5F);
      box-shadow: 2px 3px 4px rgba(0,0,0,0.3), inset -1px -1px 3px rgba(0,0,0,0.2);
      z-index: 10;
    }
    .pin::after {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background-color: rgba(255,255,255,0.6);
    }
    .pin-blue { background: radial-gradient(circle at 30% 30%, #93c5fd, #3D405B); }
    .pin-yellow { background: radial-gradient(circle at 30% 30%, #fde047, #F2CC8F); }

    @keyframes openNote {
      0% { transform: translateY(20px); opacity: 0; }
      100% { transform: translateY(0); opacity: 1; }
    }
    .animate-open-note { animation: openNote 0.5s cubic-bezier(0.25, 1, 0.5, 1) forwards; }

    @keyframes popIn {
      0% { transform: scale(0.95); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }
    .animate-pop-in { animation: popIn 0.3s cubic-bezier(0.34, 1.56, 0.64, 1) forwards; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel" data-presets="react-classic">
    const { useState, useEffect, useRef, useMemo } = React;

    // --- アプリのデータ定義（東京都の区市町村） ---
    const CITIES = [
      // 23区
      { code: '13101', name: '千代田区', kana: 'ちよだく', region: '23区' },
      { code: '13102', name: '中央区', kana: 'ちゅうおうく', region: '23区' },
      { code: '13103', name: '港区', kana: 'みなとく', region: '23区' },
      { code: '13104', name: '新宿区', kana: 'しんじゅくく', region: '23区' },
      { code: '13105', name: '文京区', kana: 'ぶんきょうく', region: '23区' },
      { code: '13106', name: '台東区', kana: 'たいとうく', region: '23区' },
      { code: '13107', name: '墨田区', kana: 'すみだく', region: '23区' },
      { code: '13108', name: '江東区', kana: 'こうとうく', region: '23区' },
      { code: '13109', name: '品川区', kana: 'しながわく', region: '23区' },
      { code: '13110', name: '目黒区', kana: 'めぐろく', region: '23区' },
      { code: '13111', name: '大田区', kana: 'おおたく', region: '23区' },
      { code: '13112', name: '世田谷区', kana: 'せたがやく', region: '23区' },
      { code: '13113', name: '渋谷区', kana: 'しぶやく', region: '23区' },
      { code: '13114', name: '中野区', kana: 'なかのく', region: '23区' },
      { code: '13115', name: '杉並区', kana: 'すぎなみく', region: '23区' },
      { code: '13116', name: '豊島区', kana: 'としまく', region: '23区' },
      { code: '13117', name: '北区', kana: 'きたく', region: '23区' },
      { code: '13118', name: '荒川区', kana: 'あらかわく', region: '23区' },
      { code: '13119', name: '板橋区', kana: 'いたばしく', region: '23区' },
      { code: '13120', name: '練馬区', kana: 'ねりまく', region: '23区' },
      { code: '13121', name: '足立区', kana: 'あだちく', region: '23区' },
      { code: '13122', name: '葛飾区', kana: 'かつしかく', region: '23区' },
      { code: '13123', name: '江戸川区', kana: 'えどがわく', region: '23区' },
      // 多摩地域
      { code: '13201', name: '八王子市', kana: 'はちおうじし', region: '多摩地域' },
      { code: '13202', name: '立川市', kana: 'たちかわし', region: '多摩地域' },
      { code: '13203', name: '武蔵野市', kana: 'むさしのし', region: '多摩地域' },
      { code: '13204', name: '三鷹市', kana: 'みたかし', region: '多摩地域' },
      { code: '13205', name: '青梅市', kana: 'おうめし', region: '多摩地域' },
      { code: '13206', name: '府中市', kana: 'ふちゅうし', region: '多摩地域' },
      { code: '13207', name: '昭島市', kana: 'あきしまし', region: '多摩地域' },
      { code: '13208', name: '調布市', kana: 'ちょうふし', region: '多摩地域' },
      { code: '13209', name: '町田市', kana: 'まちだし', region: '多摩地域' },
      { code: '13210', name: '小金井市', kana: 'こがねいし', region: '多摩地域' },
      { code: '13211', name: '小平市', kana: 'こだいらし', region: '多摩地域' },
      { code: '13212', name: '日野市', kana: 'ひのし', region: '多摩地域' },
      { code: '13213', name: '東村山市', kana: 'ひがしむらやまし', region: '多摩地域' },
      { code: '13214', name: '国分寺市', kana: 'こくぶんじし', region: '多摩地域' },
      { code: '13215', name: '国立市', kana: 'くにたちし', region: '多摩地域' },
      { code: '13218', name: '福生市', kana: 'ふっさし', region: '多摩地域' },
      { code: '13219', name: '狛江市', kana: 'こまえし', region: '多摩地域' },
      { code: '13220', name: '東大和市', kana: 'ひがしやまとし', region: '多摩地域' },
      { code: '13221', name: '清瀬市', kana: 'きよせし', region: '多摩地域' },
      { code: '13222', name: '東久留米市', kana: 'ひがしくるめし', region: '多摩地域' },
      { code: '13223', name: '武蔵村山市', kana: 'むさしむらやまし', region: '多摩地域' },
      { code: '13224', name: '多摩市', kana: 'たまし', region: '多摩地域' },
      { code: '13225', name: '稲城市', kana: 'いなぎし', region: '多摩地域' },
      { code: '13227', name: '羽村市', kana: 'はむらし', region: '多摩地域' },
      { code: '13228', name: 'あきる野市', kana: 'あきるのし', region: '多摩地域' },
      { code: '13229', name: '西東京市', kana: 'にしとうきょうし', region: '多摩地域' },
      { code: '13303', name: '瑞穂町', kana: 'みずほまち', region: '多摩地域' },
      { code: '13305', name: '日の出町', kana: 'ひのでまち', region: '多摩地域' },
      { code: '13307', name: '檜原村', kana: 'ひのはらむら', region: '多摩地域' },
      { code: '13308', name: '奥多摩町', kana: 'おくたままち', region: '多摩地域' },
      // 島しょ部
      { code: '13361', name: '大島町', kana: 'おおしままち', region: '島しょ部' },
      { code: '13362', name: '利島村', kana: 'としまむら', region: '島しょ部' },
      { code: '13363', name: '新島村', kana: 'にいじまむら', region: '島しょ部' },
      { code: '13364', name: '神津島村', kana: 'こうづしまむら', region: '島しょ部' },
      { code: '13381', name: '三宅村', kana: 'みやけむら', region: '島しょ部' },
      { code: '13382', name: '御蔵島村', kana: 'みくらじまむら', region: '島しょ部' },
      { code: '13401', name: '八丈町', kana: 'はちじょうまち', region: '島しょ部' },
      { code: '13402', name: '青ヶ島村', kana: 'あおがしまむら', region: '島しょ部' },
      { code: '13421', name: '小笠原村', kana: 'おがさわらむら', region: '島しょ部' },
    ];

    const REGION_LIST = ['23区', '多摩地域', '島しょ部'];
    const REGION_NOTE = { '23区': '23こ', '多摩地域': '30こ', '島しょ部': '9こ' };
    const isIsland = (code) => code >= '13361';

    // GeoJSON の外周リングの向きを d3 向けにそろえる
    const rewind = (feature) => {
      const fix = (polys) => polys.map(rings => {
        const test = { type: 'Polygon', coordinates: [rings[0]] };
        return d3.geoArea(test) > 2 * Math.PI ? rings.map(r => r.slice().reverse()) : rings;
      });
      const g = feature.geometry;
      let coords = g.type === 'Polygon' ? fix([g.coordinates]) : fix(g.coordinates);
      // 小笠原村の沖ノ鳥島・南鳥島は遠すぎるので地図から外す
      if (feature.properties.code === '13421') {
        coords = coords.filter(poly => {
          const [lon, lat] = poly[0][0];
          return lat > 24 && lon < 143;
        });
      }
      return { ...feature, geometry: { type: 'MultiPolygon', coordinates: coords } };
    };

    // --- ノート風のボタン（地域選択用） ---
    const RegionNote = ({ region, onClick, isSelected }) => {
      return (
        <div
          onClick={onClick}
          className={`bg-white w-full h-24 sm:h-28 rounded-sm flex flex-col items-center justify-center relative cursor-pointer transition-all p-3
            ${isSelected
              ? 'border-4 border-terracotta transform -translate-y-1 shadow-lg ring-2 ring-terracotta/30'
              : 'border border-gray-100 shadow-md hover:-translate-y-1 hover:shadow-lg'}`}
        >
          {isSelected && (
            <div className="absolute -top-3 -right-3 w-7 h-7 sm:w-8 sm:h-8 bg-terracotta text-white rounded-full flex items-center justify-center font-bold text-lg sm:text-xl shadow-md border-2 border-white z-20">
              ✓
            </div>
          )}
          <span className="font-rounded text-bluegrey font-bold text-center text-lg sm:text-xl mt-2">
            {region}
          </span>
          <span className="font-rounded text-xs text-gray-400 mt-1">{REGION_NOTE[region]}</span>
        </div>
      );
    };

    // --- アニメーション機能付き 東京都地図コンポーネント ---
    const WIDTH = 800;
    const HEIGHT = 800;

    const CityMap = ({ geoData, currentCode }) => {
      const gRef = useRef(null);
      const island = isIsland(currentCode);

      // 本土（23区・多摩）と島しょ部で表示する範囲を切りかえる
      const view = useMemo(() => {
        const features = geoData.features.filter(f => isIsland(f.properties.code) === island);
        const fc = { type: 'FeatureCollection', features };
        const projection = d3.geoMercator().fitExtent([[20, 20], [WIDTH - 20, HEIGHT - 20]], fc);
        const path = d3.geoPath().projection(projection);
        return { features, path };
      }, [geoData, island]);

      const target = view.features.find(f => f.properties.code === currentCode);

      const zoom = useMemo(() => {
        if (!target) return { scale: 1, translate: [0, 0], cx: 0, cy: 0, r: 0 };
        const b = view.path.bounds(target);
        const dx = b[1][0] - b[0][0];
        const dy = b[1][1] - b[0][1];
        const cx = (b[0][0] + b[1][0]) / 2;
        const cy = (b[0][1] + b[1][1]) / 2;
        const maxScale = island ? 14 : 5;
        const scale = Math.max(1, Math.min(maxScale, 0.35 / Math.max(dx / WIDTH, dy / HEIGHT)));
        const translate = [WIDTH / 2 - scale * cx, HEIGHT / 2 - scale * cy];
        const r = Math.max(dx, dy) / 2 + 30 / scale;
        return { scale, translate, cx, cy, r, small: Math.max(dx, dy) < 40 };
      }, [target, view, island]);

      useEffect(() => {
        if (!gRef.current) return;
        const g = d3.select(gRef.current);
        g.interrupt().attr('transform', 'translate(0,0) scale(1)');
        g.transition()
          .delay(600)
          .duration(1500)
          .ease(d3.easeCubicInOut)
          .attr('transform', `translate(${zoom.translate[0]},${zoom.translate[1]}) scale(${zoom.scale})`);
      }, [currentCode, zoom]);

      return (
        <div
          className="w-full aspect-square bg-[#eaf4f4] rounded-xl border-4 border-white shadow-inner relative mx-auto overflow-hidden flex items-center justify-center shrink-0"
          style={{ maxWidth: 'min(100%, 55vh)' }}
        >
          <svg viewBox={`0 0 ${WIDTH} ${HEIGHT}`} className="w-full h-full">
            <text x="650" y="720" fill="rgba(147, 197, 253, 0.5)" fontSize="60" fontWeight="bold">~</text>
            <text x="60" y="150" fill="rgba(147, 197, 253, 0.5)" fontSize="50" fontWeight="bold">~</text>

            <g ref={gRef}>
              {view.features.map(feature => {
                const isTarget = feature.properties.code === currentCode;
                return (
                  <path
                    key={feature.properties.code}
                    d={view.path(feature)}
                    fill={isTarget ? '#E07A5F' : '#81B29A'}
                    stroke="#ffffff"
                    strokeWidth="1.5"
                    vectorEffect="non-scaling-stroke"
                    className={`transition-colors duration-300 ${isTarget ? 'animate-pulse' : 'opacity-80'}`}
                  />
                );
              })}
              {/* 小さい島などは まるで かこんで 見つけやすくする */}
              {zoom.small && (
                <circle
                  cx={zoom.cx}
                  cy={zoom.cy}
                  r={zoom.r}
                  fill="none"
                  stroke="#E07A5F"
                  strokeWidth="3"
                  strokeDasharray="6 4"
                  vectorEffect="non-scaling-stroke"
                />
              )}
            </g>
          </svg>
          <span className="absolute top-2 left-3 font-rounded text-xs font-bold text-bluegrey/50">
            {island ? 'とうきょうと（島しょ部）' : 'とうきょうと'}
          </span>
        </div>
      );
    };

    // --- メインアプリケーション ---
    const App = () => {
      const [gameState, setGameState] = useState('TITLE');
      const [selectedRegions, setSelectedRegions] = useState([]);
      const [questions, setQuestions] = useState([]);
      const [currentIndex, setCurrentIndex] = useState(0);
      const [score, setScore] = useState(0);
      const [feedback, setFeedback] = useState(null);
      const [options, setOptions] = useState([]);
      const [hasMistaked, setHasMistaked] = useState(false);
      const [geoData, setGeoData] = useState(null);
      const [hasError, setHasError] = useState(false);

      useEffect(() => {
        fetch('tokyo_city.json')
          .then(res => {
            if (!res.ok) throw new Error('Network error');
            return res.json();
          })
          .then(data => setGeoData({ ...data, features: data.features.map(rewind) }))
          .catch(err => {
            console.error('Map fetch error:', err);
            setHasError(true);
          });
      }, []);

      const addScoreToLocal = () => {
        try {
          const currentScore = parseInt(localStorage.getItem('gogo_drill_score') || '0', 10);
          localStorage.setItem('gogo_drill_score', currentScore + 1);
        } catch (e) {}
      };

      const toggleRegion = (region) => {
        setSelectedRegions(prev =>
          prev.includes(region)
            ? prev.filter(r => r !== region)
            : [...prev, region]
        );
      };

      const startGame = () => {
        if (selectedRegions.length === 0) {
          alert('ちいきを 1つ以上 えらんでね！');
          return;
        }

        let targets = CITIES.filter(c => selectedRegions.includes(c.region));
        targets = targets.sort(() => 0.5 - Math.random());

        setQuestions(targets);
        setCurrentIndex(0);
        setScore(0);
        setHasMistaked(false);
        setFeedback(null);
        setGameState('QUIZ');
      };

      useEffect(() => {
        if (gameState === 'QUIZ' && questions.length > 0) {
          const current = questions[currentIndex];

          const sameRegion = CITIES.filter(c => c.region === current.region && c.code !== current.code);
          const others = CITIES.filter(c => c.region !== current.region);

          let newOptions = sameRegion.sort(() => 0.5 - Math.random()).slice(0, 3);

          if (newOptions.length < 3) {
            const extra = others.sort(() => 0.5 - Math.random()).slice(0, 3 - newOptions.length);
            newOptions = [...newOptions, ...extra];
          }

          newOptions.push(current);
          setOptions(newOptions.sort(() => 0.5 - Math.random()));
        }
      }, [gameState, currentIndex, questions]);

      const handleAnswer = (opt) => {
        if (feedback !== null) return;

        const isCorrect = opt.code === questions[currentIndex].code;

        if (isCorrect) {
          setFeedback('⭕️');
          if (!hasMistaked) {
            setScore(s => s + 1);
            addScoreToLocal();
          }

          setTimeout(() => {
            if (currentIndex + 1 < questions.length) {
              setCurrentIndex(i => i + 1);
              setHasMistaked(false);
              setFeedback(null);
            } else {
              setGameState('RESULT');
              setFeedback(null);
            }
          }, 1200);

        } else {
          setFeedback('❌');
          setHasMistaked(true);

          setTimeout(() => {
            setFeedback(null);
          }, 1200);
        }
      };

      const backToPortal = () => {
        window.location.href = 'https://hot-spring-egg.github.io/ontama-drill/';
      };

      return (
        <div className="w-full h-full flex flex-col items-center justify-center relative overflow-hidden bg-cork">

          {(gameState === 'TITLE' || gameState === 'SELECT') && (
            <button
              onClick={backToPortal}
              className="absolute top-4 left-4 sm:top-6 sm:left-6 bg-white/90 text-bluegrey px-4 py-2 rounded-full font-bold shadow-sm hover:shadow-md transition-all z-40 border border-gray-200 text-sm sm:text-base"
            >
              ← ドリルにもどる
            </button>
          )}

          {gameState === 'TITLE' && (
            <div className="w-full max-w-md mx-auto flex flex-col items-center justify-center p-4">
              <div className="bg-paper px-6 sm:px-8 py-6 rounded-sm shadow-md mb-12 transform -rotate-2 relative border border-white">
                <div className="pin pin-blue"></div>
                <h1 className="font-rounded text-[min(8vw,2.5rem)] font-bold text-bluegrey tracking-wider whitespace-nowrap text-center mt-2">
                  トウキョウノート
                </h1>
                <p className="text-center text-sage font-bold mt-2 text-sm sm:text-base">
                  東京都 区市町村クイズ
                </p>
              </div>

              <button
                onClick={() => setGameState('SELECT')}
                className="w-full bg-terracotta text-white font-rounded py-4 rounded-full shadow-lg active:translate-y-1 active:shadow-md text-2xl font-bold transition-all border-4 border-white"
              >
                はじめる
              </button>

              <a
                href="../"
                className="mt-6 font-rounded text-sm font-bold text-white underline drop-shadow"
              >
                チズノート（都道府県クイズ）は こちら
              </a>
            </div>
          )}

          {gameState === 'SELECT' && (
            <div className="w-full h-full flex flex-col items-center relative py-6">
              <div className="w-full max-w-4xl mx-auto flex flex-col items-center mb-4 mt-12 sm:mt-0 bg-paper/90 p-4 rounded-lg shadow-sm border border-white">
                <h2 className="font-rounded text-xl sm:text-2xl font-bold text-bluegrey">
                  どの ちいき に チャレンジする？
                </h2>
                <p className="text-sm text-gray-500 mt-1">（いくつでも えらべるよ）</p>
              </div>

              <div className="w-full max-w-3xl flex justify-end gap-4 px-4 mb-2">
                <button onClick={() => setSelectedRegions([...REGION_LIST])} className="font-rounded text-sm font-bold text-sage underline">全部えらぶ</button>
                <button onClick={() => setSelectedRegions([])} className="font-rounded text-sm font-bold text-terracotta underline">全部けす</button>
              </div>

              <div className="w-full flex-1 overflow-y-auto px-4 pt-4 pb-32">
                <div className="grid grid-cols-2 sm:grid-cols-3 gap-4 w-full max-w-3xl mx-auto">
                  {REGION_LIST.map(region => (
                    <RegionNote
                      key={region}
                      region={region}
                      isSelected={selectedRegions.includes(region)}
                      onClick={() => toggleRegion(region)}
                    />
                  ))}
                </div>
              </div>

              {selectedRegions.length > 0 && (
                <div className="absolute bottom-6 w-full flex justify-center animate-open-note z-10 px-4 pointer-events-none">
                  <button
                    onClick={startGame}
                    className="bg-sage text-white font-rounded py-3 sm:py-4 px-10 rounded-full shadow-lg active:translate-y-1 active:shadow-md text-xl font-bold transition-all border-4 border-white w-full max-w-sm pointer-events-auto"
                  >
                    クイズを スタート！
                  </button>
                </div>
              )}
            </div>
          )}

          {gameState === 'QUIZ' && questions.length > 0 && (
            <div className="w-full h-full flex flex-col p-2 sm:p-4 relative">
              <div className="w-full max-w-3xl mx-auto flex-1 flex flex-col items-center bg-paper rounded-sm shadow-xl p-2 sm:p-4 overflow-hidden relative animate-open-note border border-white">

                <div className="w-full flex justify-between items-center font-rounded text-sm sm:text-base text-bluegrey/70 mb-2 px-2">
                  <button
                    onClick={() => setGameState('SELECT')}
                    className="underline hover:text-bluegrey"
                    disabled={feedback !== null}
                  >
                    ← やめる
                  </button>
                  <div className="flex gap-3 font-bold">
                    <span className="bg-white px-3 py-1 rounded-full shadow-sm">
                      {currentIndex + 1} / {questions.length} 問
                    </span>
                    <span className="bg-white px-3 py-1 rounded-full shadow-sm text-terracotta">
                      スコア: {score}
                    </span>
                  </div>
                </div>

                {geoData ? (
                  <CityMap geoData={geoData} currentCode={questions[currentIndex].code} />
                ) : (
                  <div className="w-full aspect-square bg-[#eaf4f4] rounded-xl border-4 border-white shadow-inner mx-auto flex flex-col items-center justify-center shrink-0" style={{ maxWidth: 'min(100%, 55vh)' }}>
                    {hasError ? (
                      <p className="font-rounded font-bold text-terracotta text-lg px-4 text-center">ちずを よみこめなかったよ…<br />ページを よみなおしてね</p>
                    ) : (
                      <>
                        <div className="w-12 h-12 border-4 border-sage border-t-transparent rounded-full animate-spin mb-4"></div>
                        <p className="font-rounded font-bold text-sage text-lg">ちずを じゅんび中...</p>
                      </>
                    )}
                  </div>
                )}

                <div className="text-center my-2 shrink-0 z-10">
                  <p className="text-base sm:text-lg font-bold text-bluegrey bg-white/80 backdrop-blur-sm px-4 py-1 rounded-full shadow-sm border border-gray-100">
                    あかく ひかっている ところは どこかな？
                  </p>
                </div>

                <div className="grid grid-cols-2 gap-2 w-full max-w-md mt-auto pb-2 px-2 z-10">
                  {options.map(opt => (
                    <button
                      key={opt.code}
                      onClick={() => handleAnswer(opt)}
                      disabled={feedback !== null}
                      className="bg-white border-b-4 border-sage text-bluegrey font-rounded py-2 sm:py-3 rounded-lg shadow-md hover:bg-sage/10 active:translate-y-1 active:border-b-0 transition-all font-bold flex flex-col items-center justify-center"
                    >
                      <span className="text-[10px] sm:text-xs text-gray-500 font-normal mb-0.5">{opt.kana}</span>
                      <span className="text-lg sm:text-xl leading-none">{opt.name}</span>
                    </button>
                  ))}
                </div>

                {feedback && (
                  <div className="absolute inset-0 flex items-center justify-center z-50 pointer-events-none bg-white/30 backdrop-blur-sm">
                    <span className={`text-[12rem] drop-shadow-xl font-bold ${feedback === '⭕️' ? 'text-sage' : 'text-terracotta'} animate-pop-in`}>
                      {feedback}
                    </span>
                  </div>
                )}

                <p className="absolute bottom-0.5 right-2 text-[9px] text-gray-400 pointer-events-none">
                  出典：国土数値情報（行政区域データ）を加工して作成
                </p>
              </div>
            </div>
          )}

          {gameState === 'RESULT' && (
            <div className="w-full h-full flex flex-col p-4 sm:p-8 relative">
              <div className="w-full max-w-xl mx-auto flex-1 flex flex-col items-center justify-center bg-paper rounded-sm shadow-xl p-6 relative animate-open-note border border-white">
                <h2 className="font-rounded text-3xl sm:text-4xl font-bold mb-6 text-bluegrey border-b-2 border-sage pb-2">
                  けっか はっぴょう
                </h2>

                <p className="text-[6rem] sm:text-[8rem] font-bold text-terracotta mb-4 leading-none drop-shadow-sm">
                  {score} <span className="text-2xl sm:text-4xl text-bluegrey">てん</span>
                </p>

                <p className="font-rounded text-lg sm:text-xl mb-12 text-sage font-bold bg-white px-6 py-2 rounded-full shadow-sm">
                  {score === questions.length ? 'パーフェクト！ すごいぞ！' : 'よく がんばったね！'}
                </p>

                <div className="flex flex-col sm:flex-row gap-4 w-full">
                  <button
                    onClick={() => setGameState('SELECT')}
                    className="flex-1 bg-sage text-white font-rounded py-4 rounded-full shadow-md active:translate-y-1 active:shadow-sm text-xl font-bold transition-all"
                  >
                    ちいきを えらぶ
                  </button>
                  <button
                    onClick={backToPortal}
                    className="flex-1 bg-bluegrey text-white font-rounded py-4 rounded-full shadow-md active:translate-y-1 active:shadow-sm text-xl font-bold transition-all"
                  >
                    ドリルに もどる
                  </button>
                </div>
              </div>
            </div>
          )}

        </div>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
